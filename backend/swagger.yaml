openapi: 3.0.0

info:
  title: VouchPay API
  version: 1.0.0
  description: |
    ## Overview
    The VouchPay API (formerly Babylon Nexus) covers authentication, projects, the invoice
    lifecycle, participant coordination, vouching (Get Vouched, Give a Vouch), ABN lookups,
    notifications and admin project management.

    Served at `/api-docs` when `NODE_ENV` is not `production` — run the backend locally
    with `npm run dev` and open `http://localhost:3229/api-docs`.

    ## Invoice Lifecycle
    Invoices follow this sequential workflow:
    ```
    Pending → Approved → Paid → Received
                    ↘ Rejected (from Pending only)
    ```
    The approver is automatically resolved at submission time based on the submitter's role
    and which roles are present on the project (`approverRole` stored on the invoice).

    ## Authentication
    All protected routes require a Bearer JWT token in the `Authorization` header:
    ```
    Authorization: Bearer <access_token>
    ```
    Access tokens expire in **10 minutes**. Use `/auth/refresh` to obtain a new one.


servers:
  - url: http://localhost:3229
    description: Local development

tags:
  - name: Authentication
    description: User registration, login, token management, and password operations
  # - name: Project Manager
  #   description: Routes accessible to users with the Project Manager role
  # - name: Sub Contractor
  #   description: Routes accessible to users with the Sub Contractor role
  # - name: Builder
  #   description: Routes accessible to users with the Builder role
  - name: Multiple Roles
    description: Routes accessible to two or more roles
  - name: Account
    description: The signed-in user's own account — profile, mobile and email verification, push token
  - name: Vouch
    description: Vouch profile (Get Vouched), vouch requests, giving and receiving vouches
  - name: ABN Lookup
    description: Australian Business Register lookups (mocked when `ABR_GUID` is unset)
  - name: Notifications
    description: In-app notifications
  - name: Admin
    description: Admin-only project management. Requires the `Admin` role.

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from `/auth/login` or `/auth/refresh`

  # ─────────────────────────────────────────────
  # Reusable Schemas
  # ─────────────────────────────────────────────
  schemas:

    # ── Core Entities ──────────────────────────

    User:
      type: object
      description: A registered user (`users` collection). Secrets and codes are never returned.
      properties:
        id:
          type: string
          example: "665f1c2e8b3a4d0012345678"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        name:
          type: string
          description: Derived from firstName + lastName
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        mobile:
          type: string
          example: "0412345678"
        mobileVerified:
          type: boolean
          example: false
        abn:
          type: string
          example: "83914571673"
        businessName:
          type: string
          example: "Mitchell Construction"
        businessTrade:
          type: string
          example: "Carpentry"
        role:
          type: string
          enum: [Admin, Owner, Builder, PM, Subbie, Consultant, Financier, VIP, Observer]
          example: "Subbie"
        status:
          type: string
          description: "`Active` for verified users, `Pending` for unverified accounts"
          example: "Active"

    Project:
      type: object
      description: Represents a construction project (maps to PROJECT table)
      properties:
        id:
          type: string
          example: "proj_123e4567-e89b-12d3-a456-426614174000"
        location:
          type: string
          example: "2-4 Mintaro Ave, Strathfield 2135 (Lot 1, DP: 954705)"
        council:
          type: string
          example: "Strathfield"
        ownerId:
          type: string
          description: USER.id of the project owner
          example: "user_owner123"
        builderId:
          type: string
          description: USER.id of the builder
          example: "user_builder123"
        pmId:
          type: string
          description: USER.id of the project manager
          example: "user_pm123"
        status:
          type: string
          example: "90% Complete"

    ProjectParticipant:
      type: object
      description: Maps a user to a project with a specific role (maps to PROJECT_PARTICIPANTS table)
      properties:
        projectId:
          type: string
          description: PROJECT.id reference
          example: "proj_123e4567"
        userId:
          type: string
          description: USER.id reference (null if user has not yet registered)
          nullable: true
          example: "user_123e4567"
        role:
          type: string
          example: "Subcontractor"
        trade:
          type: string
          example: "Electrical Contractor"
        dateAdded:
          type: string
          format: date-time
          example: "2025-08-15T10:00:00Z"
        status:
          type: string
          description: "`Invited` until the user registers, then `Active`"
          example: "Active"

    Invoice:
      type: object
      description: |
        Represents an invoice in the system (maps to INVOICE table).

        **Status progression:** `Pending` → `Approved` → `Paid` → `Received`
        **Or:** `Pending` → `Rejected`
      properties:
        id:
          type: string
          example: "inv_123e4567-e89b-12d3-a456-426614174000"
        projectId:
          type: string
          description: PROJECT.id reference
          example: "proj_123e4567"
        submittingParty:
          type: string
          example: "ABC Electrical"
        submittingCategory:
          type: string
          example: "Electrical Contractor"
        submittedByUserId:
          type: string
          description: USER.id of the person who submitted the invoice
          example: "user_123e4567"
        description:
          type: string
          example: "Phase 2 electrical work"
        amount:
          type: number
          format: float
          example: 15000.00
        dateSubmitted:
          type: string
          format: date-time
          example: "2026-01-05T09:00:00Z"
        dateDue:
          type: string
          format: date-time
          description: Payment due date
          example: "2026-01-20T00:00:00Z"
        datePaid:
          type: string
          format: date-time
          nullable: true
          description: Set when approver marks as paid
          example: "2026-01-18T11:00:00Z"
        dateReceived:
          type: string
          format: date-time
          nullable: true
          description: Set when submitter confirms receipt
          example: "2026-01-19T09:30:00Z"
        status:
          type: string
          enum: [Pending, Approved, Paid, Received, Rejected]
          example: "Pending"
        approverRole:
          type: string
          description: The role responsible for approving and paying this invoice
          enum: [Owner, Builder, PM]
          example: "Builder"
        rejectionReason:
          type: string
          nullable: true
          description: Optional reason provided when an invoice is rejected
          example: "Incorrect amount on invoice"

    # ── Reusable Responses ─────────────────────

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Descriptive error message"

    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token — expires in 10 minutes
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: JWT refresh token — expires in 1 day (mobile clients)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  # ─────────────────────────────────────────────
  # Reusable Parameters
  # ─────────────────────────────────────────────
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: PROJECT.id reference
      schema:
        type: string
      example: "proj_123e4567"

    InvoiceId:
      name: invoice_id
      in: path
      required: true
      description: INVOICE.id reference
      schema:
        type: string
      example: "inv_123e4567"

  # ─────────────────────────────────────────────
  # Reusable Responses
  # ─────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Invalid or missing access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Authentication Required"

    BadRequest:
      description: Invalid or missing fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Forbidden"


# ═══════════════════════════════════════════════
# PATHS
# ═══════════════════════════════════════════════
paths:

  # ─────────────────────────────────────────────
  # Authentication
  # ─────────────────────────────────────────────

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: |
        Creates a new user account. After registration, a verification code is sent to the
        provided email address. The user **must verify their email** before they can log in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, email, password]
              properties:
                firstName:
                  type: string
                  example: "John"
                lastName:
                  type: string
                  description: Optional — some people go by a single name
                  example: "Doe"
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 50
                  description: 12–50 characters, at least 3 of upper, lower, number, special
                  example: "SecurePass123!"
                mobile:
                  type: string
                  description: Optional. Verified later via `/auth/request-mobile-otp`.
                  example: "0412345678"
                abn:
                  type: string
                  description: Optional 11-digit ABN. Must be active on the ABR and not already registered.
                  example: "83914571673"
                businessName:
                  type: string
                  example: "Mitchell Construction"
      responses:
        '201':
          description: User created — verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    example: "user_123e4567-e89b-12d3-a456-426614174000"
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticates a user and returns a JWT access token and refresh token.
        - **Access token** expires in 10 minutes
        - **Refresh token** expires in 1 day (use `/auth/refresh` to get a new access token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                password:
                  type: string
                  format: password
                  example: "SecurePass123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Invalid credentials or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid credentials"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: |
        Invalidates the user's refresh token. The client should also delete any
        locally stored access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Exchanges a valid refresh token for a new access token and refresh token.
        The old refresh token is **immediately invalidated**.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Required for mobile clients. Web clients may use an HttpOnly cookie instead.
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid or expired refresh token"
        '401':
          description: No refresh token provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Authentication Required"

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email address
      description: Verifies a user's email using the code sent after registration. Must be completed before the first login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationCode]
              properties:
                verificationCode:
                  type: string
                  example: "ABC123XYZ"
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_code:
                  summary: Code does not exist
                  value:
                    error: "Invalid Verification Code"
                expired_code:
                  summary: Code has expired
                  value:
                    error: "Verification code has expired"

  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend email verification code
      description: Sends a new verification code to the user's email. The previous code is invalidated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        '200':
          description: Verification code resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Email not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Email not found"

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request a password reset
      description: Sends a password reset code to the user's email address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        '200':
          description: Reset code sent (code also logged to backend console in dev)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Email not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Email not found"

  /auth/resend-reset-code:
    post:
      tags:
        - Authentication
      summary: Resend password reset code
      description: Sends a new reset code to the user's email. The previous reset code is invalidated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        '200':
          description: Reset code resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Email not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Email not found"

  /auth/verify-reset-code:
    post:
      tags:
        - Authentication
      summary: Verify password reset code
      description: Validates a reset code without changing the password. Use this to confirm the code is valid before showing the new password form.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetCode]
              properties:
                resetCode:
                  type: string
                  example: "ABC123XYZ"
      responses:
        '200':
          description: Reset code is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
        '400':
          description: Invalid or expired reset code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    error: "Invalid reset code"
                expired:
                  value:
                    error: "Reset code has expired"

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password using reset code
      description: Resets the user's password. The reset code is consumed and cannot be reused.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetCode, newPassword]
              properties:
                resetCode:
                  type: string
                  example: "ABC123XYZ"
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  example: "NewSecurePass123!"
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid/expired code or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_fields:
                  value:
                    error: "Reset code and password are required"
                invalid_code:
                  value:
                    error: "Invalid reset code"
                expired_code:
                  value:
                    error: "Reset code has expired"

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password (authenticated)
      description: Allows an authenticated user to change their password by providing their current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                  example: "CurrentPass123!"
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  example: "NewSecurePass123!"
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Wrong current password or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_fields:
                  value:
                    error: "Current password and new password are required"
                invalid_password:
                  value:
                    error: "Current password is incorrect"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # Projects
  # ─────────────────────────────────────────────

  /projects:
    get:
      tags:
        - Multiple Roles
      summary: Get all associated projects
      description: |
        Returns all projects associated with the authenticated user. Results are filtered by role:

        | Role | Projects returned |
        |------|------------------|
        | Project Manager | Projects where user is the PM (`PROJECT.pmId`) |
        | Builder | Projects where user is the builder (`PROJECT.builderId`) |
        | Owner | Projects where user is the owner (`PROJECT.ownerId`) |
        | Sub Contractor / Consultant | Projects in `PROJECT_PARTICIPANTS` |
      responses:
        '200':
          description: List of associated projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  total:
                    type: integer
                    description: Total number of projects
                    example: 15
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /project:
    post:
      tags:
        - Multiple Roles
      summary: Create a new project
      description: |
        Creates a new project. **Any authenticated user can create a project** — there is no role restriction.
        The creator is automatically added as a participant with the specified `creatorRole`.
        The project is `Active` from creation — there is no admin approval step. The app only
        offers project creation once the user's profile is 100% complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location, council]
              properties:
                name:
                  type: string
                  description: Optional project name
                  example: "Strathfield Residential Build"
                location:
                  type: string
                  example: "2-4 Mintaro Ave, Strathfield 2135"
                council:
                  type: string
                  example: "Strathfield"
                daNumber:
                  type: string
                  description: Optional development application number
                  example: "DA-2025-0142"
                creatorRole:
                  type: string
                  description: The role the creator will hold on this project
                  enum: [PM, Subbie, Owner, Builder, Consultant, Financier, VIP, Observer]
                  example: "PM"
                creatorHasInsurance:
                  type: boolean
                creatorHasLicence:
                  type: boolean
                hasInsurance:
                  type: boolean
                hasLicence:
                  type: boolean
                invitees:
                  type: array
                  description: People to invite on creation (each gets an invite email)
                  items:
                    type: object
                    required: [email, role]
                    properties:
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        example: "Subbie"
                      trade:
                        type: string
                        example: "Carpentry"
      responses:
        '200':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  projectId:
                    type: string
                    example: "proj_123e4567-e89b-12d3-a456-426614174000"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /project/{project_id}:
    get:
      tags:
        - Multiple Roles
      summary: Get project details
      description: Returns full details for a single project including participants and invoices.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # Participants
  # ─────────────────────────────────────────────

  /project/{project_id}/invite:
    post:
      tags:
        - Multiple Roles
      summary: Invite a participant to a project
      description: |
        Invites a person to a project by email. **Any authenticated project participant can invite** — there is no role restriction on who can invite.
        The invited person does **not** need an existing account.

        **Invitation workflow:**
        1. Inviter provides email, role, and optional trade
        2. A `ProjectParticipant` record is created with `status = "Pending"`
        3. The invited user calls `POST /project/accept` with the invite code to join
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                  example: "john.smith@electrical.com"
                role:
                  type: string
                  enum: [PM, Subbie, Owner, Builder, Consultant, Financier, VIP, Observer, Admin]
                  example: "Subbie"
                trade:
                  type: string
                  example: "Electrical Contractor"
      responses:
        '200':
          description: Participant invited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Invitation sent to john.smith@electrical.com"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /project/accept:
    post:
      tags:
        - Multiple Roles
      summary: Accept a project invitation
      description: Accepts a pending project invitation using the invite code received via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode:
                  type: string
                  example: "abc123invitetoken"
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # Invoices
  # ─────────────────────────────────────────────

  /project/{project_id}/invoice:
    post:
      tags:
        - Multiple Roles
      summary: Submit a new invoice
      description: |
        Submits an invoice for work completed on a project.

        **Who can submit:** Subbie, Consultant, Builder, PM (enforced by `requireProjectRole` middleware — Owner cannot submit)

        The `approverRole` is automatically resolved at submission time based on the submitter's role and which roles are present on the project:
        - Subbie / Consultant → Builder (fallback to PM, then Owner)
        - Builder → Owner
        - PM → Owner
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submittingParty, submittingCategory, dateDue, description, amount]
              properties:
                submittingParty:
                  type: string
                  example: "ABC Electrical"
                submittingCategory:
                  type: string
                  example: "Electrical Contractor"
                dateDue:
                  type: string
                  format: date-time
                  example: "2026-02-05T00:00:00Z"
                amount:
                  type: number
                  format: float
                  example: 15000.00
                description:
                  type: string
                  example: "Phase 2 electrical work"
      responses:
        '200':
          description: Invoice submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  invoiceId:
                    type: string
                    example: "inv_123e4567"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /project/{project_id}/invoice/{invoice_id}/approve:
    patch:
      tags:
        - Multiple Roles
      summary: Approve an invoice
      description: |
        Approves a `Pending` invoice. The caller's role must match `invoice.approverRole`.

        **Who can approve:** Whoever holds the `approverRole` on the invoice — this is resolved at submission time and can be Builder, PM, or Owner depending on which roles are present on the project.

        **Status transition:** `Pending` → `Approved`
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invoice is not in Pending status
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User's role does not match the invoice approverRole
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invoice not found"

  /project/{project_id}/invoice/{invoice_id}/paid:
    patch:
      tags:
        - Multiple Roles
      summary: Mark invoice as paid
      description: |
        Marks an `Approved` invoice as paid. The caller's role must match `invoice.approverRole`.
        Sets `datePaid` on the invoice.

        **Who can mark as paid:** Same role as the approver — Builder, PM, or Owner depending on the project's composition.

        **Status transition:** `Approved` → `Paid`
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice marked as paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invoice is not in Approved status
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User's role does not match the invoice approverRole
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invoice not found"

  /project/{project_id}/invoice/{invoice_id}/received:
    patch:
      tags:
        - Multiple Roles
      summary: Mark invoice as received
      description: |
        Confirms receipt of payment. Only the original submitter of the invoice can call this endpoint.
        Sets `dateReceived` on the invoice.

        **Who can mark as received:** The user who submitted the invoice — could be Subbie, Consultant, Builder, or PM.

        **Status transition:** `Paid` → `Received`

        This is the **final step** in the invoice lifecycle:
        ```
        Pending → Approved → Paid → Received ✓
        ```
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice marked as received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invoice is not in Paid status
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the original submitter can mark as received
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invoice not found"

  /project/{project_id}/invoice/{invoice_id}/reject:
    patch:
      tags:
        - Multiple Roles
      summary: Reject an invoice
      description: |
        Rejects a `Pending` invoice. The caller's role must match `invoice.approverRole` — this can be Builder, PM, or Owner depending on the project's composition.
        An optional rejection reason can be provided.

        **Status transition:** `Pending` → `Rejected`

        > **Note:** Rejected invoices are terminal — the submitter must raise a new invoice if needed.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rejectionReason:
                  type: string
                  description: Optional reason for rejection
                  example: "Incorrect amount — please resubmit with the correct figure"
      responses:
        '200':
          description: Invoice rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invoice is not in Pending or Approved status
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User's role does not match the invoice approverRole
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invoice not found"

  /project/{project_id}/audit-log:
    get:
      tags:
        - Multiple Roles
      summary: Get a project's invoice audit log
      description: |
        Every invoice on the project with its event history (submitted, approved, rejected,
        paid, received) and who did each step. Caller must be a participant on the project.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Audit log, grouped by invoice
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/history:
    get:
      tags:
        - Multiple Roles
      summary: Get the user's project history
      description: Projects the user has worked on, for the Me screen's project history.
      responses:
        '200':
          description: Project history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  projects:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                    example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # Account
  # ─────────────────────────────────────────────

  /auth/reactivate:
    post:
      tags:
        - Account
      summary: Reactivate a deactivated account
      description: |
        A deleted account is kept for a grace period. Logging in during it returns
        `403` with `code: ACCOUNT_DEACTIVATED` and `daysRemaining`; calling this with the
        same credentials restores the account and signs the user in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Account restored and signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenPair'
                  - type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/me:
    get:
      tags:
        - Account
      summary: Get the signed-in user
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/profile:
    patch:
      tags:
        - Account
      summary: Update business details
      description: |
        Sets the user's ABN and business name. The ABN must be active on the ABR and not
        registered to another account — this is the only way to change an ABN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                abn:
                  type: string
                  example: "83914571673"
                businessName:
                  type: string
                  example: "Mitchell Construction"
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/push-token:
    patch:
      tags:
        - Account
      summary: Register the device's Expo push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties:
                pushToken:
                  type: string
                  example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
      responses:
        '200':
          description: Saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/delete-account:
    delete:
      tags:
        - Account
      summary: Delete (deactivate) the signed-in account
      description: Soft delete. The account is deactivated and purged after 30 days; `/auth/reactivate` restores it before then.
      responses:
        '200':
          description: Account deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/request-mobile-otp:
    post:
      tags:
        - Account
      summary: Send a mobile verification code
      description: Sends an SMS code via Twilio Verify. Required before requesting vouches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile]
              properties:
                mobile:
                  type: string
                  example: "0412345678"
      responses:
        '200':
          description: Code sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many requests

  /auth/verify-mobile-otp:
    post:
      tags:
        - Account
      summary: Verify a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, code]
              properties:
                mobile:
                  type: string
                  example: "0412345678"
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Mobile verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts

  /auth/request-email-change:
    post:
      tags:
        - Account
      summary: Start an email change
      description: Sends a 6-digit code to the new address. The email doesn't change until it's verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail]
              properties:
                newEmail:
                  type: string
                  format: email
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email-change:
    post:
      tags:
        - Account
      summary: Confirm an email change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Email changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # Vouch
  # ─────────────────────────────────────────────

  /vouch/profile:
    post:
      tags:
        - Vouch
      summary: Save the Get Vouched profile and send vouch requests
      description: |
        Partial save — each wizard step sends only the fields it owns, and empty values are
        ignored. Only `idNumber`, `idExpiry` and `idState` are written from the body; name and
        ABN are copied from the account (change the ABN via `PATCH /auth/profile`). The ID type
        is always `trade-licence`.

        Each new reference in `references` gets a vouch request by email. Sending references
        requires a verified mobile and a business name + ABN on the account. Duplicate
        references (same email, or an existing request) are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessTrade:
                  type: string
                  description: One of the trade list in `utils/vouchRules.ts`
                  example: "Carpentry"
                idNumber:
                  type: string
                  example: "LIC123456"
                idExpiry:
                  type: string
                  description: DD/MM/YYYY, must not be expired
                  example: "01/01/2030"
                idState:
                  type: string
                  example: "NSW"
                references:
                  type: array
                  items:
                    type: object
                    required: [firstName, email]
                    properties:
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
                        format: email
                      company:
                        type: string
                      relationship:
                        type: string
                        example: "Head Contractor"
                      project:
                        type: string
      responses:
        '201':
          description: The saved profile
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Mobile not verified (when sending references)
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Too many requests

  /vouch/profile/me:
    get:
      tags:
        - Vouch
      summary: Get the signed-in user's vouch profile and completion
      description: |
        The saved profile (if any) plus `businessTrade` from the account, and the profile
        completion. 100% (`isComplete`) is what unlocks giving a vouch and creating a project.
      responses:
        '200':
          description: Profile and completion
          content:
            application/json:
              schema:
                type: object
                properties:
                  businessTrade:
                    type: string
                  profileStrength:
                    type: integer
                    example: 100
                  stepsDone:
                    type: array
                    items:
                      type: boolean
                  stepsLeft:
                    type: integer
                    example: 0
                  isComplete:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vouch/requests/sent:
    get:
      tags:
        - Vouch
      summary: List vouch requests the user has sent
      responses:
        '200':
          description: Sent requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vouch/requests/{requestId}/nudge:
    post:
      tags:
        - Vouch
      summary: Re-send a vouch request to a reference who hasn't answered
      description: Allowed once every 24 hours per request, and only while it's unanswered.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Nudge sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  lastSentAt:
                    type: string
                    format: date-time
        '400':
          description: Invalid id, already answered, or nudged too recently
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Request not found

  /vouch/requests/{requestId}:
    delete:
      tags:
        - Vouch
      summary: Withdraw an unanswered vouch request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid id or already answered
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Request not found

  /vouch/pending-requests:
    get:
      tags:
        - Vouch
      summary: List vouch requests waiting on the signed-in user
      description: Requests addressed to the user's email (or legacy mobile) that they haven't answered or ignored.
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vouch/requests/{id}/ignore:
    patch:
      tags:
        - Vouch
      summary: Ignore a vouch request addressed to the user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Request isn't addressed to this user
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Request not found

  /vouch/give:
    post:
      tags:
        - Vouch
      summary: Give a vouch to a business
      description: |
        One vouch per giver per ABN (`409` on a repeat). The giver can't vouch for their own
        ABN. `attributes` must be at least 2 of the 16 in `utils/vouchRules.ts`. Pass
        `requestId` when answering a vouch request — it must be addressed to the giver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toAbn, attributes]
              properties:
                toAbn:
                  type: string
                  example: "47100074445"
                toBusinessName:
                  type: string
                  example: "Vouched Test Co"
                attributes:
                  type: array
                  minItems: 2
                  items:
                    type: string
                  example: ["Reliable", "Quality work"]
                note:
                  type: string
                  example: "Always delivers."
                requestId:
                  type: string
                recipientFirstName:
                  type: string
                recipientLastName:
                  type: string
                recipientEmail:
                  type: string
                  format: email
                recipientMobile:
                  type: string
      responses:
        '201':
          description: Vouch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  vouch:
                    type: object
                  vouchCount:
                    type: integer
                    example: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The request isn't addressed to this user
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Vouch request not found
        '409':
          description: Already vouched for this business

  /vouch/given:
    get:
      tags:
        - Vouch
      summary: List vouches the user has given
      responses:
        '200':
          description: Given vouches
          content:
            application/json:
              schema:
                type: object
                properties:
                  vouches:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vouch/received:
    get:
      tags:
        - Vouch
      summary: List vouches received by the user's ABN
      description: Each vouch includes the giver's details and whether the user has already vouched back.
      responses:
        '200':
          description: Received vouches (empty if the user has no ABN)
          content:
            application/json:
              schema:
                type: object
                properties:
                  vouches:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vouch/business/{abn}:
    get:
      tags:
        - Vouch
      summary: Vouch summary for a business
      description: |
        `isOnVouch` is true when the business has a Get Vouched profile. When it does, the
        response also has the attribute tally and the top three as `attributeSummary`.
      parameters:
        - name: abn
          in: path
          required: true
          schema:
            type: string
          example: "47100074445"
      responses:
        '200':
          description: Business summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  isOnVouch:
                    type: boolean
                  vouchCount:
                    type: integer
                  alreadyVouched:
                    type: boolean
                  attributeSummary:
                    type: string
                    example: "Reliable · Quality work · Honest"
                  attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        attr:
                          type: string
                        count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vouch/notifications:
    get:
      tags:
        - Vouch
      summary: List vouch notifications
      responses:
        '200':
          description: Vouch notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vouch/notifications/read-all:
    patch:
      tags:
        - Vouch
      summary: Mark all vouch notifications read
      responses:
        '200':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'

  /vouch/notifications/{id}/read:
    patch:
      tags:
        - Vouch
      summary: Mark one vouch notification read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Done
        '400':
          description: Invalid notification id
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # ABN Lookup
  # ─────────────────────────────────────────────

  /abr/lookup:
    get:
      tags:
        - ABN Lookup
      summary: Look up an ABN
      description: Calls the ABR (5s timeout). Returns a mock when `ABR_GUID` is unset.
      security: []
      parameters:
        - name: abn
          in: query
          required: true
          schema:
            type: string
          example: "83914571673"
      responses:
        '200':
          description: ABN details
        '400':
          description: ABN must be 11 digits
          $ref: '#/components/responses/BadRequest'
        '404':
          description: ABN not found
        '410':
          description: ABN cancelled
        '503':
          description: ABR unavailable or timed out

  /abr/search:
    get:
      tags:
        - ABN Lookup
      summary: Search businesses by name
      description: Up to 10 matches from the ABR. Returns mocks when `ABR_GUID` is unset.
      security: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 3
          example: "Mitchell Construction"
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        abn:
                          type: string
                        entityName:
                          type: string
                        state:
                          type: string
        '400':
          description: Name must be at least 3 characters
          $ref: '#/components/responses/BadRequest'
        '503':
          description: ABR unavailable or timed out

  # ─────────────────────────────────────────────
  # Notifications
  # ─────────────────────────────────────────────

  /notifications:
    get:
      tags:
        - Notifications
      summary: List the user's project notifications
      responses:
        '200':
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        projectId:
                          type: string
                        projectName:
                          type: string
                        invoiceId:
                          type: string
                          nullable: true
                        type:
                          type: string
                        message:
                          type: string
                        read:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    patch:
      tags:
        - Notifications
      summary: Mark all project notifications read
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  updatedCount:
                    type: integer
                    example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────
  # Admin
  # ─────────────────────────────────────────────

  /admin/projects/active:
    get:
      tags:
        - Admin
      summary: List active projects
      responses:
        '200':
          description: Active projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  projects:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/projects/inactive:
    get:
      tags:
        - Admin
      summary: List inactive (removed) projects
      responses:
        '200':
          description: Inactive projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  projects:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/projects/{project_id}:
    get:
      tags:
        - Admin
      summary: Get a project's full detail
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project detail with participants and invoices
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Project not found
    delete:
      tags:
        - Admin
      summary: Remove a project
      description: Soft delete — the project becomes `Inactive`.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Project not found

  /admin/projects/{project_id}/participants/remove:
    delete:
      tags:
        - Admin
      summary: Remove a participant from a project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  example: "Subbie"
      responses:
        '200':
          description: Participant removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  removedCount:
                    type: integer
                    example: 1
                  message:
                    type: string
                    example: "Participant removed"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
